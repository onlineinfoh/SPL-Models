# =============================================================================
# SPL-Models: pre-committed analysis plan
# =============================================================================
#
# This file fixes every decision in the two-stage pipeline before the locked
# re-analysis loads, evaluates or inspects any external cohort. Enforcement is
# by protocol/gate.py at runtime, with an audit trail in gate_audit.jsonl.
# It is NOT externally registered; see the registration status below.
#
# Any deviation from this file after registration must be recorded in
# protocol/DEVIATIONS.md with the reason and the date. Silent deviation
# invalidates the lock.
#
# Registration status, stated accurately:
#   This plan was NOT registered with a third party and NOT tagged before the
#   run. It was written immediately before the locked re-analysis and committed
#   afterwards, in the same commit as the results. There is therefore no
#   external timestamp establishing that it preceded the analysis, and no claim
#   to that effect should be made from it.
#   osf_registration_url: none
#   git_tag:              none
#   first_committed:      2026-09-21, commit ccdf241
#
# -----------------------------------------------------------------------------

meta:
  title: >-
    Two-stage deep learning framework for segmentation and benign-malignant
    differentiation of subpleural pulmonary lesions on grayscale ultrasound
  protocol_version: 1
  supersedes: >-
    All prior runs in this repository, including the 13-architecture original
    run and the internal-only multi-seed sweep. Those are retained unmodified
    under superseded/ as the audit record and are not reported as results.

# -----------------------------------------------------------------------------
# 1. Cohorts
# -----------------------------------------------------------------------------
#
# One representative grayscale frame per patient. Because one image is analysed
# per patient, image-level and patient-level resampling are equivalent.

data:
  root: data/                      # single data root; new_data/ is not used
  cohorts:
    train:
      n: 600
      centre: Center 1
      images: data/train/imagesTr
      masks:  data/train/labelsTr
      labels: binary_classification/labels/labels_train.csv
      role: model fitting only
    internal_val:
      n: 257
      centre: Center 1
      images: data/val/img_v
      masks:  data/val/seg_v
      labels: binary_classification/labels/labels_internal_val.csv
      role: >-
        Checkpoint selection, architecture selection and threshold derivation.
        This cohort is used for all three purposes; that reuse is declared here
        rather than discovered later.
    external_test1:
      n: 108
      centre: Center 2
      images: data/test1/img_test1
      masks:  data/test1/seg_test1
      labels: binary_classification/labels/labels_external_test1.csv
      role: held out until lock
    external_test2:
      n: 94
      centre: Center 3
      images: data/test2/img_test2
      masks:  data/test2/seg_test2
      labels: binary_classification/labels/labels_external_test2.csv
      role: held out until lock

  # Automatic-mask ("model") variants of each image directory carry the
  # _model suffix and are produced by Stage 1. Manual-mask ("gt") variants are
  # the directories named above.
  mask_variants: [gt, model]

# -----------------------------------------------------------------------------
# 2. Hold-out enforcement
# -----------------------------------------------------------------------------

holdout:
  gated_paths:
    - data/test1
    - data/test2
    - data/test1/img_test1_model
    - data/test2/img_test2_model
    - binary_classification/labels/labels_external_test1.csv
    - binary_classification/labels/labels_external_test2.csv
  mechanism: >-
    protocol/gate.py installs a runtime guard that raises ExternalDataLocked on
    any read of a gated path while protocol/locked_pipeline.json is absent. The
    guard is imported by every training and selection entry point. It is not a
    convention; a gated read terminates the process.
  release_condition: >-
    protocol/locked_pipeline.json exists and validates. That file is written
    only by the Phase D lock step, which consumes internal results alone.
  forbidden_before_lock:
    - computing any metric on external_test1 or external_test2
    - logging any external metric during training
    - using external results to choose an architecture, checkpoint,
      hyperparameter, preprocessing step, mask variant or threshold

# -----------------------------------------------------------------------------
# 3. Stage 1: segmentation
# -----------------------------------------------------------------------------

segmentation:
  trained_on: train              # n = 600, Center 1, exclusively
  checkpoint_rule: >-
    Highest Dice on internal_val, evaluated once per epoch. Applies to all three
    models so the comparison uses one rule.

  models:
    nnunet:
      framework: nnunetv2==2.8.1
      dataset_id: Dataset000_lung
      configuration: "2d"
      trainer: nnUNetTrainer
      plans: nnUNetPlans
      fold: all
      patch_size: [896, 1792]
      batch_size: 2
      spacing: [1.0, 1.0]
      normalization: CTNormalization
      use_mask_for_norm: false
      epochs: 1000
      optimizer: SGD
      initial_lr: 0.01
      weight_decay: 3.0e-05
      foreground_oversampling: 0.33
      note: >-
        fold_all has no held-out validation by default. A custom trainer
        evaluates internal_val Dice each epoch and retains the best checkpoint,
        replacing nnU-Net's own checkpoint_final policy.

    unet:
      framework: Pytorch-UNet (upstream, pinned)
      n_channels: 1
      n_classes: 2
      bilinear: false
      input: [512, 512]
      normalization: per-image max scaling
      epochs: 350
      batch_size: 1
      learning_rate: 5.0e-04
      validation: internal_val
      note: >-
        Corrects the original run, which used validation split 0 and therefore
        computed validation metrics on the training set.

    deeplabv3plus:
      framework: DeepLabV3Plus-Pytorch (upstream, pinned)
      model: deeplabv3plus_mobilenet
      output_stride: 16
      num_classes: 2
      input: [512, 512]
      normalization: ImageNet
      crop_size: 512
      batch_size: 4
      total_iterations: 30000
      learning_rate: 0.01
      lr_schedule: poly
      validation: internal_val

  selected_model: >-
    Highest mean Dice on internal_val. External cohorts take no part in this
    choice.

  metrics:
    computed_by: analysis/code/seg_metrics_engine.py
    class: lesion (foreground) only
    resolution: native image grid
    reported: [dice, iou, precision, recall, fpr, hd95, assd]
    definitions:
      precision: TP / (TP + FP), denominator = all pixels predicted lesion
      recall:    TP / (TP + FN), denominator = all pixels truly lesion
      fpr:       FP / (FP + TN), denominator = all pixels truly background
      hd95_assd: pixels on the native grid; undefined when either mask is empty
    central_tendency:
      dice_iou_precision_recall_fpr: mean with 95% bootstrap percentile CI
      hd95_assd: median with IQR, because the distributions are right-skewed
    predicted_masks_for: [train, internal_val, external_test1, external_test2]

# -----------------------------------------------------------------------------
# 4. Stage 2: classification
# -----------------------------------------------------------------------------

classification:
  trained_on: train              # n = 600, Center 1, exclusively

  architectures:                 # all 13; no narrowing of the candidate pool
    - inception_v3
    - vgg19
    - resnet18
    - resnet50
    - resnet101
    - efficientnet_b0
    - efficientnet_b1
    - efficientnet_b2
    - efficientnet_b3
    - efficientnet_b4
    - efficientnet_b5
    - densenet121
    - densenet201

  seeds:
    primary: 67                  # declared in advance; results come from this seed
    robustness: [1234, 2025]     # repeats only; take no part in any selection
  total_runs: 39                 # 13 architectures x 3 seeds

  preprocessing:
    input_channels: 2            # (image, mask)
    crop: lesion bounding box + 10 percent halo
    halo_frac: 0.10
    input_size: [300, 300]       # training AND inference; no resolution change
    standardisation: per-channel
    empty_mask_fallback: >-
      Centred square crop when a mask contains no positive pixel. Across all
      1059 study cases this branch was never taken.

  optimisation:
    epochs: 40
    batch_size: 16
    optimizer: AdamW
    lr: 1.0e-04
    weight_decay: 5.0e-04
    scheduler: CosineAnnealingLR
    eta_min: 1.0e-06
    loss: BCEWithLogitsLoss
    sample_weight: mask.mean() * 0.9 + 0.1, clamped at minimum 0.1
    label_smoothing: 0.1
    sampler: WeightedRandomSampler on inverse class frequency
    early_stopping_patience: 8
    pretraining: ImageNet, first conv adapted to 2 channels by averaging RGB filters

  augmentation:                  # training split only
    horizontal_flip: {p: 0.5}
    rotation: {p: 0.5, degrees: [-20, 20], padding: reflect}
    gamma: {p: 0.7, range: [0.6, 1.4]}
    contrast: {p: 0.7, range: [0.75, 1.25]}
    gaussian_noise: {p: 0.5, sd: 6.0, scale: 0-255}
    note: >-
      The original train.py applied cv2.warpAffine to an (H, W, 1) array, which
      returns (H, W); the subsequent img[..., 0] therefore indexed a single
      column, so intensity augmentation affected one column in rotated samples.
      This is corrected in the locked implementation.

  # ---------------------------------------------------------------------------
  # Selection rule. This is the single most consequential line in the protocol.
  # ---------------------------------------------------------------------------
  selection:
    criterion: AUC on internal_val
    checkpoint: argmax internal_val AUC within a run
    architecture: >-
      argmax internal_val AUC across all 13 architectures at the primary seed.
      Robustness seeds are reported but take no part.

    tie_break:
      - higher accuracy at the architecture's own accuracy-maximising threshold
      - alphabetical architecture name
      note: >-
        Declared because a tie is not hypothetical: on the 300 px path at the
        primary seed two architectures tie exactly on accuracy, and AUC ties are
        possible on 257 cases. Without a declared tie-break the winner falls out
        of list ordering inside sorted(), which is not a scientific criterion.
        phase_lock raises rather than silently resolving any tie the declared
        rules do not settle.

    also_reported: >-
      The ranking under accuracy, at both a fixed 0.5 threshold and each
      architecture's own optimal threshold, is reported alongside the AUC
      ranking. "Accuracy on internal_val" is ambiguous and the readings
      disagree: at fixed 0.5 the original run ranks efficientnet_b2 first and
      densenet121 ninth; the 300 px sweep produces an exact
      efficientnet_b0/densenet121 tie; only the per-architecture
      optimal-threshold reading ranks densenet121 first. Reporting all of them
      is the honest presentation, and their disagreement is itself a finding.

    known_limitation: >-
      This is NOT demonstrably the rule the December 2025 run followed. That run
      retained checkpoints on fixed-0.5 internal accuracy. The artifact
      checkpoint_selection_summary.csv evidences only WHICH EPOCH was retained
      inside an already-launched run; it is silent on how the architecture pool
      or the architecture itself was chosen, and must not be cited as evidence
      for the architecture rule.

    interpretation: >-
      On the internal-only multi-seed sweep the leading architectures are
      separated by less than the between-seed standard deviation of a single
      architecture (top-5 mean accuracy 0.8353 to 0.8405, between-seed SD 0.014
      to 0.022). Internal validation on 257 cases therefore does not distinguish
      these architectures, and the reported result is the cluster rather than a
      winner. Any claim that a selection rule identified the best architecture
      on internal data alone is not supported by these data.

    outcome_contract: >-
      Whatever architecture this rule returns IS the reported result. Revising
      the rule after seeing Phase D output would be a fresh instance of the
      practice the reviewer is objecting to, and is prohibited by this protocol.

    external_role: none

  threshold:
    derived_on: internal_val
    rule: Youden J = sensitivity + specificity - 1
    implemented_by: analysis/code/common.py::threshold_youden
    driver: protocol/run_protocol.py::phase_lock
    applied_to: external_test1 and external_test2, unchanged
    note: >-
      Derived inside the repository and committed, so every reported operating
      point maps to code. The original run used an accuracy-maximising
      threshold; for DenseNet121 that value coincided with the Youden-optimal
      point.

# -----------------------------------------------------------------------------
# 5. Outputs
# -----------------------------------------------------------------------------

outputs:
  probability_files:
    schema: case_id,label,prob_malignant
    cohorts: [train, internal_val, external_test1, external_test2]
    primary: selected architecture at seed 67
    robustness: same architecture at seeds 1234 and 2025
  segmentation_tables: per cohort, per model, all metrics above
  lock_record:
    path: protocol/locked_pipeline.json
    contents: >-
      Selected segmentation model, selected architecture, seed, threshold,
      SHA256 of every weight file, git commit SHA, environment record.

# -----------------------------------------------------------------------------
# 6. Statistical procedures
# -----------------------------------------------------------------------------

statistics:
  bootstrap: {n_resamples: 2000, seed: 20260904, method: stratified percentile}
  auc_ci: DeLong, logit-transformed
  auc_comparison: DeLong test for correlated ROC curves
  proportion_ci: >-
    Wilson score on class-specific denominators; sensitivity over malignant
    cases, specificity over benign cases.
  calibration: [intercept, slope, Brier score, 10-bin quantile curve]
  decision_curve: net benefit against treat-all and treat-none

# -----------------------------------------------------------------------------
# 7. Environment
# -----------------------------------------------------------------------------

environment:
  lock_file: requirements.lock.txt
  python: 3.11.14
  torch: 2.13.0+cu126
  torchvision: 0.28.0+cu126
  cuda: "12.6"
  cudnn: "91002"
  nnunetv2: 2.8.1
  numpy: 1.26.4
  scipy: 1.10.0
  scikit_learn: 1.9.0
  nibabel: 5.4.2
  simpleitk: 2.5.6
  opencv_python: 4.11.0.86
  gpu: NVIDIA GeForce RTX 4090
  determinism: >-
    torch.backends.cudnn.deterministic is false, so runs are reproducible in
    distribution rather than bitwise. Seeds are fixed for torch, numpy and CUDA.

# -----------------------------------------------------------------------------
# 8. What this protocol does and does not establish
# -----------------------------------------------------------------------------

scope:
  establishes:
    - The pipeline is fully specified and reproducible from a single commit.
    - Every selection is made on internal data, enforced at runtime, not asserted.
    - External cohorts are scored exactly once, after the lock.
  does_not_establish: >-
    This protocol governs the locked re-analysis. It does not retroactively
    render Center 2 and Center 3 unseen with respect to the original run, in
    which external metrics were computed during development. Claims in the
    manuscript must be limited to reproducibility and rule-adherence, which this
    demonstrates, and must not assert that the external cohorts were unseen at
    the time the architecture was first chosen.
